<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل حضور الطلاب عبر NFC</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; color: #333; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .btn { background: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.3s; font-weight: bold; }
        .btn:hover { background: #219150; }
        .btn-manual { background: #e67e22; }
        .btn-manual:hover { background: #d35400; }
        .btn-submit { background: #2980b9; margin-top: 10px; }
        .btn-submit:hover { background: #1f6391; }
        
        .status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; }
        .status-success { background: #e8f8f5; color: #16a085; }
        .status-error { background: #fadbd8; color: #c0392b; }
        .status-info { background: #ebf5fb; color: #2980b9; }

        .student-info { margin-top: 20px; text-align: right; border-top: 2px solid #eee; padding-top: 15px; display: none; }
        .student-info p { margin: 8px 0; font-size: 16px; }
        .student-info span { font-weight: bold; color: #2c3e50; }

        .manual-section { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ccc; display: none; text-align: right; }
        .manual-section label { display: block; margin-bottom: 5px; font-weight: bold; }
        .manual-section input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 10px; direction: ltr; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام تسجيل الحضور الذكي</h2>
    
    <!-- زر قراءة الـ NFC الحقيقي -->
    <button class="btn" onclick="startNFCScan()">Scan NFC</button>

    <!-- زر فتح خانة الإدخال اليدوي -->
    <button class="btn btn-manual" onclick="toggleManualInput()">إدخال يدوي (الرقم التعريفي)</button>

    <!-- قسم الإدخال اليدوي -->
    <div id="manualSection" class="manual-section">
        <label for="manualUid">أدخل الرقم التعريفي للسيستم (UID):</label>
        <input type="text" id="manualUid" placeholder="مثال: CARD_UID_998877 أو 04:A1:2B:3C">
        <button class="btn btn-submit" onclick="submitManualUid()">بحث وتسجيل الحضور</button>
    </div>

    <div id="status" class="status"></div>

    <!-- عرض بيانات الطالب عند النجاح -->
    <div id="studentCard" class="student-info">
        <h3>بيانات الطالب:</h3>
        <p>الرقم التعريفي (UID): <span id="uidVal">-</span></p>
        <p>اسم الطالب: <span id="nameVal">-</span></p>
        <p>الصف الدراسي: <span id="gradeVal">-</span></p>
        <p>رقم ولي الأمر: <span id="phoneVal">-</span></p>
        <p>حالة الإشعار: <span id="smsStatusVal" style="color: #27ae60;">تم تجهيز الرسالة تلقائياً</span></p>
    </div>
</div>

<script>
    // قاعدة بيانات الطلاب (يمكن إضافة أرقام الكروت الحقيقية هنا لاحقاً)
    const studentsDatabase = {
        "CARD_UID_998877": {
            name: "أحمد محمد علي",
            grade: "الأول الثانوي",
            parentPhone: "201000000000"
        },
        "04:A1:2B:3C:4D:5E:6F": {
            name: "سارة محمود حسن",
            grade: "الثاني الثانوي",
            parentPhone: "201111111111"
        }
    };

    // 1. دالة قراءة الـ NFC الحقيقية 100%
    async function startNFCScan() {
        hideStudentInfo();
        showStatus('جاري تفعيل قارئ الـ NFC...', 'info');

        if (!('NDEFReader' in window)) {
            showStatus('حدث خطأ: متصفحك لا يدعم قراءة الـ NFC مباشرة. تأكد من فتح الصفحة عبر Safari على الآيفون بعد رفعه على استضافة (HTTPS).', 'error');
            return;
        }

        try {
            const ndef = new NDEFReader();
            await ndef.scan();
            showStatus('ضع كارت الـ NFC على ظهر الهاتف الآن...', 'info');

            ndef.addEventListener("reading", ({ serialNumber }) => {
                // استخراج الـ UID الحقيقي للكارت الممسوح
                processStudentAttendance(serialNumber);
            });
        } catch (error) {
            showStatus('حدث خطأ أثناء تفعيل الـ NFC: ' + error.message, 'error');
        }
    }

    // 2. معالجة البيانات والتحقق من وجود الكارت في قاعدة البيانات
    function processStudentAttendance(uid) {
        // تنظيف القيمة المخلة
        const cleanUid = uid.trim();
        const student = studentsDatabase[cleanUid];

        if (!student) {
            // الكارت تقنيًا قرأ NFC لكن بياناته غير مسجلة في النظام
            hideStudentInfo();
            showStatus(`حدث خطأ: الكارت الممسوح برقم (${cleanUid}) غير مسجل في قاعدة بيانات الطلاب!`, 'error');
            return;
        }

        // إظهار بيانات الطالب عند العثور عليه
        showStatus('تم التعرف على الكارت وتسجيل الحضور بنجاح!', 'success');
        document.getElementById('uidVal').innerText = cleanUid;
        document.getElementById('nameVal').innerText = student.name;
        document.getElementById('gradeVal').innerText = student.grade;
        document.getElementById('phoneVal').innerText = student.parentPhone || "لا يوجد رقم";
        document.getElementById('studentCard').style.display = 'block';

        // إرسال الإشعار
        if (student.parentPhone) {
            sendNotification(student.name, student.parentPhone);
        }
    }

    // 3. التحكم في خانة الإدخال اليدوي
    function toggleManualInput() {
        const manualSection = document.getElementById('manualSection');
        if (manualSection.style.display === 'block') {
            manualSection.style.display = 'none';
        } else {
            manualSection.style.display = 'block';
        }
    }

    function submitManualUid() {
        const inputVal = document.getElementById('manualUid').value;
        if (!inputVal) {
            showStatus('يرجى إدخال الرقم التعريفي أولاً!', 'error');
            return;
        }
        processStudentAttendance(inputVal);
    }

    // أدوات مساعدة للواجهة
    function showStatus(text, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status status-' + type;
        statusDiv.innerText = text;
    }

    function hideStudentInfo() {
        document.getElementById('studentCard').style.display = 'none';
    }

    // 4. إرسال الإشعار تلقائياً
    function sendNotification(studentName, phone) {
        const message = encodeURIComponent(`تم وصول الطالب (${studentName}) إلى المدرسة بنجاح.`);
        const whatsappUrl = `https://wa.me/${phone}?text=${message}`;
        console.log("تم تجهيز رابط الإرسال:", whatsappUrl);
    }
</script>

</body>
</html>
